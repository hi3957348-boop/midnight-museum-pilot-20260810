<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#24144f">
  <title>동물 주장글 · 파일럿 입장</title>
  <link rel="stylesheet" href="../assets/oncuvate-theme.css">
  <link rel="stylesheet" href="../pilot-entry.css">
  <style>.nickname-select{width:100%;min-height:54px;padding:0 15px;border:2px solid var(--oc-violet-200);border-radius:14px;color:var(--oc-violet-950);background:#fff;font-size:15px;font-weight:800;outline:none}.nickname-select:focus{border-color:var(--oc-cyan)}.nickname-select:focus-visible{outline:3px solid rgba(75,201,220,.55);outline-offset:3px}.room-label{margin-top:17px}.entry-content{padding-top:42px}.role-tabs{margin-top:22px}.role-panel{margin-top:18px}.room-input{height:66px}.entry-status{margin-top:18px}@media(max-width:780px){.entry-content{padding-top:28px}.jelly-character{width:180px;height:180px}.room-label{margin-top:14px}}</style>
</head>
<body>
  <main class="entry-shell">
    <section class="entry-card" aria-labelledby="entryTitle">
      <div class="entry-visual" aria-hidden="true">
        <div class="museum-glow"></div>
        <img class="brand-logo" src="../assets/oncuvate-brand-logo.png" alt="">
        <img class="jelly-character" src="../assets/jelly-writing-pencil.png" alt="">
        <div class="visual-copy"><small>ONCUVATE WRITING · PILOT</small><strong>동물 주장글</strong><span>실시간 글쓰기 수업</span></div>
      </div>
      <div class="entry-content">
        <div class="entry-heading">
          <small>LIVE CLASS ENTRY</small>
          <h1 id="entryTitle">어떻게 입장할까요?</h1>
          <p>강사와 학생이 같은 다섯 자리 번호를 사용하면 서로 다른 컴퓨터에서도 바로 연결됩니다.</p>
        </div>
        <div class="role-tabs" role="tablist" aria-label="입장 역할">
          <button type="button" role="tab" id="studentTab" aria-controls="studentPanel" aria-selected="true">학생</button>
          <button type="button" role="tab" id="coachTab" aria-controls="coachPanel" aria-selected="false">강사</button>
        </div>
        <section class="role-panel" id="studentPanel" role="tabpanel" aria-labelledby="studentTab">
          <label class="field-label" for="studentNickname">사용할 별명</label>
          <select class="nickname-select" id="studentNickname">
            <option value="">별명을 골라 주세요</option>
            <option>보라별</option><option>초록연필</option><option>파란구름</option>
            <option>노란나비</option><option>은빛달</option><option>민트고래</option>
          </select>
          <label class="field-label room-label" for="studentRoom">강사가 알려준 방 번호</label>
          <input class="room-input" id="studentRoom" inputmode="numeric" autocomplete="one-time-code" maxlength="5" placeholder="00000" aria-describedby="studentHelp">
          <p class="field-help" id="studentHelp">별명 하나와 숫자 다섯 자리를 확인한 뒤 입장하세요.</p>
          <button class="primary-entry" id="joinStudent" type="button">학생으로 입장</button>
        </section>
        <section class="role-panel" id="coachPanel" role="tabpanel" aria-labelledby="coachTab" hidden>
          <div class="room-ticket">
            <small>오늘의 수업방</small>
            <strong id="coachRoom">00000</strong>
            <span>이 번호를 학생에게 알려주세요.</span>
          </div>
          <button class="secondary-entry" id="newRoom" type="button">새 번호 만들기</button>
          <button class="primary-entry" id="joinCoach" type="button">강사 화면 열기</button>
        </section>
        <div class="entry-status" id="entryStatus" role="status" aria-live="polite">수업방 서버를 확인하고 있어요.</div>
        <p class="pilot-note">파일럿 운영용 · 실명 대신 준비된 별명을 사용합니다. 수업방은 만든 뒤 3시간 동안 유효합니다.</p>
      </div>
    </section>
  </main>
  <script type="module" src="./pilot-realtime.js?v=20260810-8"></script>
  <script>
    const studentTab=document.getElementById('studentTab');
    const coachTab=document.getElementById('coachTab');
    const studentPanel=document.getElementById('studentPanel');
    const coachPanel=document.getElementById('coachPanel');
    const studentRoom=document.getElementById('studentRoom');
    const studentNickname=document.getElementById('studentNickname');
    const coachRoom=document.getElementById('coachRoom');
    const status=document.getElementById('entryStatus');
    let realtimeReady=false;
    function makeRoom(){return String(Math.floor(10000+Math.random()*90000))}
    function showRole(role){const student=role==='student';studentTab.setAttribute('aria-selected',String(student));coachTab.setAttribute('aria-selected',String(!student));studentPanel.hidden=!student;coachPanel.hidden=student;requestAnimationFrame(()=>student?studentNickname.focus():document.getElementById('joinCoach').focus())}
    function waitForRealtime(){if(window.OncuvatePilotRealtime)return Promise.resolve(window.OncuvatePilotRealtime);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('realtime-timeout')),8000);window.addEventListener('oncuvate:pilot-realtime-ready',()=>{clearTimeout(timer);resolve(window.OncuvatePilotRealtime)},{once:true})})}
    async function checkRealtime(){try{await waitForRealtime();realtimeReady=true;status.className='entry-status ready';status.textContent='Firebase 실시간 수업방 준비 완료'}catch(error){realtimeReady=false;status.className='entry-status error';status.textContent='실시간 수업방에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.'}}
    function normalizeRoom(){studentRoom.value=studentRoom.value.replace(/\D/g,'').slice(0,5)}
    studentTab.addEventListener('click',()=>showRole('student'));
    coachTab.addEventListener('click',()=>showRole('coach'));
    studentRoom.addEventListener('input',normalizeRoom);
    studentRoom.addEventListener('keydown',event=>{if(event.key==='Enter')document.getElementById('joinStudent').click()});
    document.getElementById('newRoom').addEventListener('click',()=>{coachRoom.textContent=makeRoom();status.className='entry-status ready';status.textContent='새 방 번호를 만들었어요.'});
    document.getElementById('joinCoach').addEventListener('click',async()=>{if(!realtimeReady)return checkRealtime();status.textContent='수업방을 여는 중…';try{const api=await waitForRealtime();const room=await api.createRoom(coachRoom.textContent.trim());location.href='lesson.html?mode=self&v=20260810-8&pilotRole=coach&room='+room}catch(error){status.className='entry-status error';status.textContent='수업방을 열지 못했어요. 잠시 후 다시 시도해 주세요.'}});
    document.getElementById('joinStudent').addEventListener('click',async()=>{normalizeRoom();const room=studentRoom.value;const nickname=studentNickname.value;if(!nickname){status.className='entry-status error';status.textContent='먼저 사용할 별명을 골라 주세요.';studentNickname.focus();return}if(!/^\d{5}$/.test(room)){status.className='entry-status error';status.textContent='방 번호 다섯 자리를 입력해 주세요.';studentRoom.focus();return}if(!realtimeReady)return checkRealtime();status.textContent='수업방을 찾는 중…';try{const api=await waitForRealtime();await api.joinRoom(room,nickname);location.href='lesson.html?mode=self&v=20260810-8&pilotRole=child&room='+room+'&child='+encodeURIComponent(nickname)}catch(error){status.className='entry-status error';status.textContent='아직 열리지 않은 방이에요. 강사에게 번호를 다시 확인해 주세요.'}});
    coachRoom.textContent=makeRoom();checkRealtime();
  </script>
</body>
</html>
